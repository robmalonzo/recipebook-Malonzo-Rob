{% extends 'base.html' %}

{% load static %}

{% block title %}
Recipe List
{% endblock %}

{% block content %}
    <ul>
        {% for recipe in object_list %}
        <li>
            <a href='{{ recipe.get_absolute_url }}'>{{ recipe.name }}</a>
        </li>
        {% endfor %}
    </ul>
    <ul><li>
        {% if user.is_authenticated %}
        <a href="{% url 'ledger:recipe_add' %}">Add New Recipe</a>
        {% endif %}
    </ul></li>
        
{% endblock %}
