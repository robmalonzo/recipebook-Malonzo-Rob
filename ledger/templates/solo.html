{% extends 'base.html' %}

{% load static %
}
{% block title %}
Recipe Book

{% endblock %}

{% block content %}
    <h1>{{ recipe.name }}</h1>

    <h2>Ingredients:</h2>
    <ul>
        {% for ingredient in recipe.ingredients.all %}
        <li>
            {{ ingredient.ingredient.name }} - {{ ingredient.quantity }}
        </li>
        {% endfor %}
    </ul>

{% endblock %}
